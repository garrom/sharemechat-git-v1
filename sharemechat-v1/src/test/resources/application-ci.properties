# =========================================================
# PERFIL CI — tests de integracion con contexto completo (@SpringBootTest)
# =========================================================
# NO apunta a ningun entorno real. La datasource la inyecta Testcontainers
# via @DynamicPropertySource (MySQL efimero). El resto son valores
# localhost/dummy cuyo unico fin es que el ApplicationContext resuelva TODOS
# los placeholders y arranque OFFLINE (sin Redis, SMTP, S3, ni APIs de vendor).
# Redis/SMTP/S3 son lazy: se autoconfiguran pero no abren conexion al arrancar.
# =========================================================

# --- Placeholders sin default del application.properties base ---
# (spring.datasource.password la sobrescribe @DynamicPropertySource)
spring.datasource.password=ci
spring.mail.password=ci
spring.redis.password=ci
jwt.secret=ci-jwt-secret-0123456789-0123456789-0123456789-0123456789
consent.hmacSecret=ci-consent-secret-value
authrisk.env=ci

# --- Claves normalmente definidas por application-<env>.properties ---
# spring.datasource.url la fija @DynamicPropertySource (Testcontainers MySQL).
auth.cookieDomain=localhost
app.public.base-url=http://localhost
app.assets.base-url=http://localhost
app.frontend.product-origin=http://localhost:3000
app.frontend.admin-origin=http://localhost:3000
app.frontend.reset-url=http://localhost/reset-password
app.frontend.verify-email-product-url=http://localhost/verify-email
app.frontend.verify-email-admin-url=http://localhost/verify-email
app.frontend.master-invite-activate-url=http://localhost/master/invite/activate

# --- Flyway aplica el BASELINE de esquema real (un solo script determinista),
#     NO las 51 migraciones (V42 colisiona de forma no-determinista en fresh-apply
#     por depender del segundo de reloj; ver docs/pending-hardening). Hibernate valida.
#     El baseline se regenera con scratchpad/gen-baseline.sh cuando cambie el esquema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-it
spring.jpa.hibernate.ddl-auto=validate

# --- Storage local (nada de S3) ---
app.storage.type=local

# --- Vendors OFF: garantiza cero red en runtime del test ---
# (claude.api.enabled default es true en el base, hay que apagarlo explicito)
claude.api.enabled=false
kyc.didit.enabled=false
kyc.veriff.enabled=false
moderation.sightengine.enabled=false
moderation.presence.enabled=false
moderation.liveness.enabled=false
translation.google.enabled=false
psp.nowpayments.enabled=false
authrisk.enabled=false
account.dormancy.enabled=false
presence.telemetry.enabled=false
content.public.index-enabled=false

# --- S3 de evidencia vacio: el guard blank deja los @PostConstruct en no-op ---
moderation.evidence.s3.bucket=
moderation.evidence.s3.region=
