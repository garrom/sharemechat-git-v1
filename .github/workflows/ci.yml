name: CI

# Estrategia de testing (ADR-059). Tres jobs en cada push/PR:
#   - backend: unit + integración (Testcontainers MySQL sobre baseline determinista).
#   - frontend: unit/component (Jest + React Testing Library).
#   - e2e: Playwright (Chromium) sobre el frontend product con backend MOCKEADO
#     por interceptación de red (el backend real ya está cubierto por integración).

on:
  push:
  pull_request:

# Cancela runs viejos del mismo ref si llega uno nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sharemechat-v1
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend (react-scripts test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sharemechat-v1/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: sharemechat-v1/frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run frontend tests
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --passWithNoTests

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sharemechat-v1/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: sharemechat-v1/frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        env:
          CI: 'true'
        # playwright.config.js arranca el dev server (react-scripts start, .env.product)
        # en :3100 y corre los specs de e2e/ con el backend mockeado por red.
        run: npx playwright test

  docs-consistency:
    name: Docs consistency (Motor 2, ADR-061)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Motor 2: detector de podredumbre repo-wide (enlaces rotos, rutas muertas,
      # patrones caducados, integridad de ADRs). Stdlib de Python, sin deps.
      # Falla solo ante hallazgos NUEVOS (los preexistentes viven en baseline.txt).
      - name: Run repo consistency check
        run: python3 sharemechat-v1/ops/repo-consistency/check.py

  facts-generation:
    name: Facts generation (Motor 1, ADR-061)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Motor 1: los bloques generados de docs/KB deben coincidir con su fuente
      # única (docs/_data/*.yaml). Si tocaste la fuente y no regeneraste (o
      # editaste un bloque a mano), el CI falla. El anclaje fuente<->sistema lo
      # verifica el test de integracion (perfil ci) del job backend.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Check generated blocks are in sync with sources of truth
        run: python3 sharemechat-v1/ops/facts/build_facts.py --check
