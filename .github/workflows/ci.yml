name: CI

# Fase 0 de la estrategia de testing (ADR-059): red mínima que garantiza que la
# suite se ejecuta en cada push/PR. Hoy el backend es unit/mock (no necesita BD),
# el frontend aún no tiene tests (passWithNoTests). Las fases 1-4 (integración con
# Testcontainers para dinero/matching/streaming + tests de frontend) se añaden aquí.

on:
  push:
  pull_request:

# Cancela runs viejos del mismo ref si llega uno nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sharemechat-v1
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend (react-scripts test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sharemechat-v1/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: sharemechat-v1/frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run frontend tests
        env:
          CI: 'true'
        run: npx react-scripts test --watchAll=false --passWithNoTests
